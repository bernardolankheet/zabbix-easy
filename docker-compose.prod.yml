# Produção — use: docker compose -f docker-compose.prod.yml up --build -d
# Copie .env.example para .env e ajuste ZABBIX_SERVER_HOSTID e demais variáveis.

services:
  go-app:
    build: ./app
    image: zabbix-easy-report:local
    container_name: zabbix-easy-report
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      APP_DEBUG: ${APP_DEBUG:-false}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-10}
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-60}
      CHECKTRENDTIME: ${CHECKTRENDTIME:-15d}
      ZABBIX_SERVER_HOSTID: ${ZABBIX_SERVER_HOSTID:-10084}
      APP_API_KEY: ${APP_API_KEY:-}
      ZABBIX_TLS_VERIFY: ${ZABBIX_TLS_VERIFY:-false}
      RATE_LIMIT_START_RPM: ${RATE_LIMIT_START_RPM:-20}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-zabbix_report}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "pidof go-zabbix-app >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    profiles: ["db"]
    image: postgres:15-alpine
    container_name: zabbix-easy-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-zabbix_report}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-zabbix_report}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
    name: zabbix_easy_postgres_data
