name: Tests

on:
  push:
    branches: [ dev, main ]
    paths:
      - 'app/**'
  pull_request:
    branches: [ dev, main ]
    paths:
      - 'app/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run unit tests
        run: go test ./...
