services:
  go-app:
    build: ./app
    image: go-zabbix-app-local
    container_name: go-zabbix-app
    ports:
      - "8080:8080"
    volumes:
      - ./app/web:/root/web:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    environment:
      # Uncomment the variables below to enable report persistence in PostgreSQL.
      # To start with the database: docker compose --profile db up --build -d
      # - DB_HOST=postgres
      # - DB_PORT=5432
      # - DB_USER=postgres
      # - DB_PASSWORD=postgres
      # - DB_NAME=zabbix_report
      - MAX_CONCURRENT=10 # Maximum concurrent Zabbix API workers (legacy alias: MAX_CCONCURRENT)
      - API_TIMEOUT_SECONDS=20   # Used in frontend environments with low performance, increases the timeout for Zabbix API response.
      - ZABBIX_SERVER_HOSTID=10084 # HostID of the Zabbix Server, used to fetch performance data.
      - APP_DEBUG=true # true or false Enables debug logs for the Zabbix API
      - CHECKTRENDTIME=15d # Time to check data trends, do not use history (<7d), takes into account the value defined in Zabbix for Trends or the value used in database partitioning.
      - RATE_LIMIT_START_RPM=20 # Max POST /api/start requests per IP per minute
      # Optional security / TLS settings:
      # - APP_API_KEY=change-me          # Protects POST /api/start, /api/hosts/resolve and DELETE /api/reports*
      # - ZABBIX_TLS_VERIFY=true         # Verify TLS certificates when calling the Zabbix API (default: insecure/skip verify)
    restart: unless-stopped
# To start with the database: docker compose --profile db up --build -d    
  postgres:
    profiles: ["db"]
    image: postgres:15-alpine
    container_name: go-zabbix-postgres
    environment:
      POSTGRES_DB: zabbix_report
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d zabbix_report"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
    name: go_zabbix_postgres_data